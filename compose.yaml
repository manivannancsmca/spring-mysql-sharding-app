version: '3.8'

services:
  # 1. Lookup Database
  db_lookup:
    image: mysql:8.0
    container_name: mysql_lookup
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: product_lookup_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3307:3306"
    volumes:
      - ./init-sql/lookup.sql:/docker-entrypoint-initdb.dir/lookup.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uappuser", "-papppassword"]
      timeout: 5s
      retries: 10
      interval: 3s
    networks:
      - sharding-network

  # 2. Shard 1 Database
  db_shard1:
    image: mysql:8.0
